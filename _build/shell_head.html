<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --fg:#16181d; --muted:#5b6472; --line:#dfe3ea;
  --accent:#d8342a; --accent2:#1f6feb; --hl:#e8f3ff; --hlb:#8fc0f5;
  --note:#eef7ee; --noteb:#4c9a4c; --warn:#fff6e5; --warnb:#d99a2b;
  --deep:#f0ecfb; --deepb:#7c5cd0;
  --quote:#f2f3f6; --code:#f0f2f5;
  --sidebar:#ffffff;
  --exbg:#e9f6ee; --exbd:#66ac7d; --exfg:#1e6b3c;
  --alertbg:#fdeaea; --alertbd:#d24b4b; --alertfg:#b02020; --pfbg:#fdfaef;
  --maxw:980px;
  --link:#1a5fd0; --linkv:#6b3fa0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161a; --card:#1c1f25; --fg:#e7e9ee; --muted:#9aa3b2; --line:#2c313a;
    --accent:#ff6b5e; --accent2:#5aa2ff; --hl:#16283f; --hlb:#2f5c93;
    --note:#16261a; --noteb:#4f9e56; --warn:#2b2413; --warnb:#c99a3a;
    --deep:#221a35; --deepb:#b49bf0;
    --quote:#22262d; --code:#22262d; --sidebar:#1c1f25;
  --exbg:#16261d; --exbd:#3f7d55; --exfg:#7fd2a0;
  --alertbg:#2c1618; --alertbd:#8e3a3a; --alertfg:#ff8a8a; --pfbg:#232019;
  --link:#7db8ff; --linkv:#cba6ff;
  }
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --card:#ffffff; --fg:#16181d; --muted:#5b6472; --line:#dfe3ea;
  --accent:#d8342a; --accent2:#1f6feb; --hl:#e8f3ff; --hlb:#8fc0f5;
  --note:#eef7ee; --noteb:#4c9a4c; --warn:#fff6e5; --warnb:#d99a2b;
  --deep:#f0ecfb; --deepb:#7c5cd0;
  --quote:#f2f3f6; --code:#f0f2f5; --sidebar:#ffffff;
  --exbg:#e9f6ee; --exbd:#66ac7d; --exfg:#1e6b3c;
  --alertbg:#fdeaea; --alertbd:#d24b4b; --alertfg:#b02020; --pfbg:#fdfaef;
  --link:#1a5fd0; --linkv:#6b3fa0;
}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1c1f25; --fg:#e7e9ee; --muted:#9aa3b2; --line:#2c313a;
  --accent:#ff6b5e; --accent2:#5aa2ff; --hl:#16283f; --hlb:#2f5c93;
  --note:#16261a; --noteb:#4f9e56; --warn:#2b2413; --warnb:#c99a3a;
  --quote:#22262d; --code:#22262d; --sidebar:#1c1f25;
  --exbg:#16261d; --exbd:#3f7d55; --exfg:#7fd2a0;
  --alertbg:#2c1618; --alertbd:#8e3a3a; --alertfg:#ff8a8a; --pfbg:#232019;
  --deep:#221a35; --deepb:#b49bf0;
  --link:#7db8ff; --linkv:#cba6ff;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:80px}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Segoe UI","Assistant","Rubik","Noto Sans Hebrew",Arial,sans-serif;
  font-size:17px; line-height:1.75;
}

/* ===== links =====
   There was no rule here at all, so every link fell back to the browser's
   #0000EE / #551A8B -- close to unreadable on a #14161a page, and the visited
   purple worst of all. Must stay above the components that colour their own
   links: nav.toc a and .prac a match at the same specificity as a:visited, and
   only source order keeps them winning. */
a{color:var(--link)}
a:visited{color:var(--linkv)}

/* ===== top bar ===== */
.topbar{
  position:sticky; top:0; z-index:50; background:var(--card);
  border-bottom:1px solid var(--line); padding:.55rem 1rem;
  display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
  box-shadow:0 1px 6px rgba(0,0,0,.05);
}
.topbar .brand{font-weight:700; font-size:1rem; white-space:nowrap;
  color:inherit; text-decoration:none; border-bottom:2px solid transparent}
.topbar .brand:hover{border-bottom-color:var(--accent)}
.topbar .brand span{color:var(--accent)}
.topbar .spacer{flex:1}
/* always-visible way back to the index. styled like the topbar buttons so it
   reads as an action, not as part of the title */
.topbar .home{
  font:inherit; font-size:.85rem; padding:.3rem .75rem; white-space:nowrap;
  border:1px solid var(--line); border-radius:999px; background:var(--bg);
  color:var(--fg); text-decoration:none;
}
.topbar .home:hover{border-color:var(--accent2); color:var(--accent2)}
nav.toc a.home{margin-bottom:.45rem; font-weight:600; background:var(--hl)}
nav.toc a.home:hover{color:var(--accent2)}
.topbar input[type=search]{
  font:inherit; font-size:.9rem; padding:.35rem .7rem; min-width:180px;
  border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--fg);
}
.topbar button{
  font:inherit; font-size:.85rem; padding:.35rem .7rem; cursor:pointer;
  border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--fg);
}
.topbar button:hover{border-color:var(--accent2)}
#hitinfo{font-size:.8rem; color:var(--muted); min-width:64px; text-align:center}

/* ===== layout ===== */
.wrap{display:grid; grid-template-columns:270px minmax(0,1fr); gap:1.6rem; max-width:1360px; margin:0 auto; padding:1.4rem 1rem 5rem}
nav.toc{position:sticky; top:66px; align-self:start; max-height:calc(100vh - 84px); overflow:auto;
  background:var(--sidebar); border:1px solid var(--line); border-radius:12px; padding:.9rem .8rem; font-size:.9rem}
nav.toc h2{margin:.1rem 0 .6rem; font-size:.82rem; letter-spacing:.04em; color:var(--muted); text-transform:uppercase}
nav.toc ol{list-style:none; margin:0; padding:0}
nav.toc li{margin:.1rem 0}
nav.toc a{display:block; padding:.32rem .5rem; border-radius:7px; color:var(--fg); text-decoration:none; line-height:1.4}
nav.toc a:hover{background:var(--hl)}
nav.toc a.active{background:var(--hl); color:var(--accent2); font-weight:600; box-shadow:inset 3px 0 0 var(--accent2)}
nav.toc .num{color:var(--muted); font-size:.8rem; margin-left:.35rem}
/* ===== contents groups (index only) =====
   The index lists 30 pages in five families, which is a long scroll for a
   sidebar. Each family is a <details> that starts closed, so the menu opens as
   five lines and the reader expands the one they want. The state is per group
   and remembered, so the family you work out of stays open across visits.
   The chevron is ▾ / ▴ rather than a rotating glyph: it reads as "opens
   downwards" / "closes upwards" at a glance. */
nav.toc details.tocgrp{margin:0 0 .2rem}
nav.toc details.tocgrp > summary{
  list-style:none; cursor:pointer; display:flex; align-items:center;
  padding:.32rem .5rem; border-radius:7px;
  font-size:.82rem; letter-spacing:.04em; text-transform:uppercase;
  font-weight:700; color:var(--muted);
}
nav.toc details.tocgrp > summary::-webkit-details-marker{display:none}
nav.toc details.tocgrp > summary::after{
  content:"▾"; margin-inline-start:auto; font-size:1.05em; opacity:.9}
nav.toc details.tocgrp[open] > summary::after{content:"▴"}
nav.toc details.tocgrp > summary:hover{background:var(--hl); color:var(--accent2)}
nav.toc details.tocgrp > summary:focus-visible{
  outline:2px solid var(--accent2); outline-offset:-2px}
nav.toc details.tocgrp > ol{margin-bottom:.45rem}
nav.toc .todo{display:block; padding:.32rem .5rem; color:var(--muted); opacity:.65; line-height:1.4}
nav.toc .todo em{font-size:.75rem; font-style:normal; border:1px solid var(--warnb); color:var(--warnb);
                 border-radius:999px; padding:0 .4em; margin-right:.3em; white-space:nowrap}
.warn.banner{margin:0 0 1.4rem}

main{min-width:0; max-width:var(--maxw)}

/* ===== folding the contents panel away =====
   Hiding the sidebar is only worth a click if the space it frees goes to the
   page. main is normally capped at --maxw so prose keeps a readable measure;
   with the panel gone that cap can be raised without the lines getting long,
   and the wide tables are what gain the most.
   The panel collapses by shrinking its own grid column to zero rather than
   sliding out of the viewport, so nothing ever overflows the page and the
   sticky positioning keeps working. */
.wrap{transition:grid-template-columns .3s ease, gap .3s ease}
nav.toc{min-width:0; transition:opacity .18s ease, padding .3s ease, border-width .3s ease}
body.tocoff .wrap{grid-template-columns:0 minmax(0,1fr); gap:0}
body.tocoff nav.toc{opacity:0; visibility:hidden; padding-left:0; padding-right:0; border-width:0;
  transition:opacity .18s ease, padding .3s ease, border-width .3s ease, visibility 0s linear .3s}
body.tocoff main{max-width:1240px; margin-inline:auto}
.topbar button.tocbtn{font-size:.95rem; line-height:1}
/* restoring the saved state on load must not animate: the page would slide
   sideways on every visit */
body:not(.ready) .wrap, body:not(.ready) nav.toc{transition:none}

/* ===== headings ===== */
.pagehead{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.5rem 1.6rem; margin-bottom:1.6rem}
.pagehead .kicker{color:var(--muted); font-size:.85rem; letter-spacing:.05em}
.pagehead h1{margin:.25rem 0 .5rem; font-size:1.95rem; line-height:1.25}
.pagehead h1 span{color:var(--accent)}
.pagehead .meta{color:var(--muted); font-size:.9rem}

section.lec{margin:0 0 2.2rem}
section.lec > h2{
  font-size:1.35rem; margin:2.2rem 0 .9rem; padding-bottom:.45rem;
  border-bottom:2px solid var(--accent); display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap;
}
section.lec > h2 .lecnum{font-size:.8rem; color:#fff; background:var(--accent); padding:.12rem .5rem; border-radius:999px; font-weight:600}
section.lec > h2 .en{font-size:.8rem; color:var(--muted); font-weight:400; direction:ltr}

/* ===== slide card ===== */
.slide{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.25rem; margin:0 0 1rem; position:relative}
.slide > h3{margin:.1rem 0 .7rem; font-size:1.1rem; color:var(--accent); padding-left:5.4rem}
.slide > h3 .en{font-size:.78rem; color:var(--muted); font-weight:400; direction:ltr; margin-right:.4rem}
.pg{position:absolute; left:.85rem; top:.8rem; font-size:.72rem; color:var(--muted);
    background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:.05rem .5rem; white-space:nowrap}
.slide p{margin:.5rem 0}
.slide ul,.slide ol{margin:.5rem 0; padding-inline-start:1.35rem}
.slide li{margin:.3rem 0}
.slide ul.tight li,.slide ol.tight li{margin:.12rem 0}
.sub{color:var(--muted); font-size:.9rem}

/* a source that exists only as a PDF beside the repo -- a class deck, the
   textbook, an exam with no page of its own. It used to be a relative link,
   which resolved on disk and 404'd on the published site, because make_site.py
   copies the HTML pages and nothing else. Naming the file in a tooltip keeps
   the pointer without promising a page that is not there. */
.src{color:var(--muted); border-bottom:1px dotted currentColor; cursor:help}

/* one line appended to a 📖 box by crosslink.py: the closest worked example
   elsewhere in the course, or -- inside a tutorial -- the exam parts that
   turned out to test it. Set apart from the box's own text because it is
   generated, not written. */
.prachint{font-size:.9rem; color:var(--muted); margin:.45rem 0 0;
          padding-top:.35rem; border-top:1px dashed var(--line)}

/* ===== "where this is practised" strip =====
   Sits under a sub-lecture heading and points at the tutorial questions, the
   homework and the exam parts that drill it. Deliberately NOT .note/.warn/
   .deep: build.py folds those into <details>, and this is navigation, not
   commentary -- it has to be visible the moment you land on the anchor.
   Each link is its own flex item, so a label that opens in Latin ("HW2") is
   its own bidi paragraph and cannot flip the ones beside it. That is also why
   there are no separator characters: the gap does the work. */
.prac{display:flex; flex-wrap:wrap; align-items:center; gap:.32rem .4rem;
      margin:0 0 1rem; padding:.5rem .7rem; font-size:.84rem;
      background:var(--code); border:1px solid var(--line); border-radius:10px;
      border-right:4px solid var(--hlb)}
.prac > .t{font-weight:700; color:var(--muted); margin-inline-end:.15rem; white-space:nowrap}
.prac a{text-decoration:none; white-space:nowrap; border-radius:999px;
        padding:.1rem .55rem; border:1px solid var(--hlb);
        background:var(--hl); color:var(--accent2)}
.prac a:hover{border-color:var(--accent2); background:var(--card)}
.prac a.hw{border-color:var(--exbd); background:var(--exbg); color:var(--exfg)}
.prac a.ex{border-color:var(--alertbd); background:var(--alertbg); color:var(--alertfg)}
.prac a.pt{border-color:var(--deepb); background:var(--deep); color:var(--deepb)}
@media print{.prac{background:transparent; border-right-width:1px}
             .prac a{background:transparent}}
/* index page: each part is a card whose heading links to the file */
.slide > h3 > a{color:inherit; text-decoration:none; border-bottom:2px solid transparent}
.slide > h3 > a:hover{border-bottom-color:currentColor}
.slide > h3 .ok,.slide > h3 .wip,.slide > h3 .soon{
  font-size:.72rem; font-weight:600; border-radius:999px; padding:.1rem .55rem;
  margin-right:.5rem; white-space:nowrap; vertical-align:middle}
.slide > h3 .ok{background:var(--exbg); color:var(--exfg); border:1px solid var(--exbd)}
.slide > h3 .wip{background:var(--warn); color:var(--warnb); border:1px solid var(--warnb)}
.slide > h3 .soon{background:var(--code); color:var(--muted); border:1px solid var(--line)}

/* ===== boxes =====
   Our own commentary is a <details>, so it can be folded away to leave just the
   slide. The slide's own framed blocks (.def / .ex) are never collapsible. */
.note,.warn,.deep{border-radius:10px; margin:.9rem 0; font-size:.96rem}
.note{background:var(--note); border:1px solid var(--noteb); border-right:4px solid var(--noteb)}
.warn{background:var(--warn); border:1px solid var(--warnb); border-right:4px solid var(--warnb)}
/* deep-dive: in-depth explanation, real-world context, an extra worked example.
   Our addition and clearly beyond the slide — violet, so a reader never mistakes
   it for the slide's own framed content or for exam-critical material. */
.deep{background:var(--deep); border:1px solid var(--deepb); border-right:4px solid var(--deepb)}
.note .t,.warn .t,.deep .t{font-weight:700; display:block; margin-bottom:.25rem}
.note ul,.warn ul,.deep ul{margin:.35rem 0}

details.note,details.warn,details.deep{padding:0}
details.note > summary,details.warn > summary,details.deep > summary{
  font-weight:700; cursor:pointer; list-style:none; padding:.6rem 1rem;
  display:flex; align-items:center; gap:.5rem; border-radius:8px;
}
details.note > summary::-webkit-details-marker,
details.warn > summary::-webkit-details-marker,
details.deep > summary::-webkit-details-marker{display:none}
/* the chevron sits on the far (left) edge in RTL and turns when open */
details.note > summary::after,details.warn > summary::after,details.deep > summary::after{
  content:"▾"; margin-inline-start:auto; font-size:.8em; opacity:.7;
  transition:transform .15s ease; transform:rotate(-90deg);
}
details[open] > summary::after{transform:rotate(0deg)}
details.note > summary:hover,details.warn > summary:hover,details.deep > summary:hover{filter:brightness(.97)}
details.note > summary:focus-visible,details.warn > summary:focus-visible,details.deep > summary:focus-visible{
  outline:2px solid var(--accent2); outline-offset:-2px}
.dbody{padding:0 1rem .8rem}
.dbody > :first-child{margin-top:0}
.dbody > :last-child{margin-bottom:0}
.warn.banner{padding:.8rem 1rem}
.warn.banner .t{margin-bottom:.25rem}
.warn.banner p:last-child{margin-bottom:0}

/* A figure clipped out of a slide. Capped well below the card width: these are
   schematic plots, and at full width they swamp the text they illustrate. */
img.fig{display:block; margin:1rem auto; max-width:min(100%, 460px); height:auto;
        border:1px solid var(--line); border-radius:8px; background:#fff; padding:.4rem}
img.fig.wide{max-width:min(100%, 620px)}

/* ===== practice-exam solution box =====
   Written literally as <details class="sol"> in the body file, so build.py's
   collapsible() never touches it and the fold button's JS (which only knows
   details.note / details.warn) never forces it open. On a practice exam the
   solution must start CLOSED and open only when the reader asks — otherwise
   the exam is unsolvable. Same reason it stays closed when printing a blank
   copy: the beforeprint handler opens only the commentary boxes. */
details.sol{background:var(--hl); border:1px solid var(--hlb);
            border-right:4px solid var(--accent2); border-radius:10px;
            margin:.9rem 0; font-size:.96rem; padding:0}
details.sol > summary{font-weight:800; cursor:pointer; list-style:none;
            padding:.6rem 1rem; display:flex; align-items:center; gap:.5rem;
            border-radius:8px; color:var(--accent2)}
details.sol > summary::-webkit-details-marker{display:none}
details.sol > summary::after{content:"▾"; margin-inline-start:auto;
            font-size:1em; opacity:.85}
details.sol[open] > summary::after{content:"▴"}
details.sol > summary:hover{filter:brightness(.97)}
details.sol > summary:focus-visible{outline:2px solid var(--accent2); outline-offset:-2px}
.solbtn{font:inherit; font-size:.9rem; font-weight:700; cursor:pointer;
        background:var(--card); color:var(--accent2); border:1px solid var(--hlb);
        border-radius:999px; padding:.35rem .9rem; margin-inline-end:.5rem}
.solbtn:hover{background:var(--hl)}

/* boxed Definition / Theorem and boxed Example, mirroring the framed blocks
   the slides themselves use */
.def,.ex{border-radius:9px; padding:.75rem 1rem; margin:.9rem 0}
.def{background:var(--code); border:2px solid var(--fg)}
.ex{background:var(--exbg); border:1px solid var(--exbd)}
.def > .t,.ex > .t{font-weight:800; display:block; margin-bottom:.3rem; font-size:1.02rem}
.ex > .t{color:var(--exfg)}
.def p:last-child,.ex p:last-child{margin-bottom:0}
.def .eq,.ex .eq{background:transparent; border:0; padding:.3rem 0; margin:.5rem 0}
/* the red "Warning!" strip some slides use — again the slide's own, not ours */
.alert{background:var(--alertbg); border:2px solid var(--alertbd); border-radius:9px;
       padding:.6rem 1rem; margin:.9rem 0; font-weight:700}
.alert > .t{color:var(--alertfg); font-weight:800; margin-inline-end:.35rem}
.alert p{margin:0}
.pf{background:var(--pfbg); border:1px solid var(--line); border-radius:9px; padding:.75rem 1rem; margin:.9rem 0}
.pf > .t{font-weight:800; display:block; margin-bottom:.3rem}
.pf .eq{background:transparent; border:0; padding:.3rem 0; margin:.4rem 0}
.pf p:last-child{margin-bottom:0}

/* ===== quote ===== */
.quotecard{display:grid; grid-template-columns:auto 1fr; gap:1.1rem; align-items:start;
  background:var(--quote); border:1px solid var(--line); border-radius:12px; padding:2.3rem 1.25rem 1.1rem; margin:0 0 1rem; position:relative}
.quotecard img{width:150px; border-radius:8px; display:block}
.quotecard .qen{direction:ltr; text-align:left; font-size:1.5rem; font-weight:800; line-height:1.25; margin:.1rem 0 .5rem}
.quotecard .qhe{font-size:1.12rem; font-weight:600; color:var(--accent2); margin:.2rem 0 .5rem}
.quotecard .who{font-weight:700; color:var(--muted); font-size:1rem}
.quotecard .src{font-size:.74rem; color:var(--muted); direction:ltr; text-align:left; margin-top:.3rem; word-break:break-all}
.quotecard .src a{color:var(--muted)}
@media(max-width:640px){.quotecard{grid-template-columns:1fr}.quotecard img{width:120px}}

/* ===== math ===== */
/* ============ math ============
   Formulas are real MathML, rendered natively by the browser — no library, no
   web font, works offline. Two rules matter:
   1. Cambria Math is a genuine OpenType MATH font and ships with Windows/Office;
      the serif fallbacks keep it sane elsewhere.
   2. Ordinary function parentheses are marked stretchy="false" in the markup.
      Left stretchy, Chrome blows them up to the height of a neighbouring sum or
      fraction. Real delimiters (matrices) are deliberately left stretchy. */
/* `direction:ltr` alone is not enough, and the gap between the two cost real
   damage. Without `unicode-bidi:isolate` a formula is still a participant in
   the surrounding RTL paragraph, so two formulas separated only by Hebrew can
   be reordered by the bidi algorithm. In Part 4 §4.8 that turned "estimate
   Var_F by Var_F-hat" into its exact opposite on screen while the source was
   right. Isolating makes each formula an atom that keeps its place; the
   inline margin is what the isolation would otherwise cost in spacing. */
math{direction:ltr; unicode-bidi:isolate;
     font-family:"Cambria Math","STIX Two Math","Latin Modern Math",serif;
     margin-inline:.14em}
math[display="block"]{margin:0; font-size:1.3rem}
/* underlined vector (X with a low line), as the Part 5 slides write the sample.
   MathML munder puts the line inside the glyph box and it disappears at text
   size, so the underline is drawn by CSS instead. */
.uvec{text-decoration:underline; text-underline-offset:.12em}
/* A line that is a Hebrew sentence with formulas in it, rather than a formula.
   Written as ordinary RTL markup with the mathematics as separate islands,
   because MathML lays its own children out left to right and would put the
   first Hebrew word at the wrong end. See fixmixed.py. */
.mixed{unicode-bidi:isolate}
.eq .mixed{font-size:1.2rem; line-height:1.7}
p math, li math, td math, figcaption math, .note math, .warn math, .sub math, h3 math, .t math{font-size:1.05em}

.eq{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.4rem 1rem;
    background:var(--code); border:1px solid var(--line);
    border-radius:9px; padding:.8rem .9rem; margin:.8rem 0; overflow-x:auto}
/* a formula followed by "כאשר …" is stacked vertically. laid out in a row it
   would be reordered by RTL and the definition would land before the formula. */
.eq.stack{flex-direction:column; gap:.2rem}
.eq .eqsep{font-size:.95rem; color:var(--muted)}
/* code listings copied off a slide: latin, left-to-right, and scrolling on its
   own so a long line never widens the page */
pre.code{direction:ltr; text-align:left; background:var(--code);
    border:1px solid var(--line); border-radius:9px; padding:.7rem .9rem;
    margin:.8rem 0; overflow-x:auto; font-size:.9rem; line-height:1.5}
pre.code code{font-family:Consolas,"Courier New",monospace; white-space:pre}
/* plain numbers / latin fragments inside Hebrew prose: isolate them so the bidi
   algorithm keeps them intact, and keep a hair of space on both sides so they
   never glue to the adjacent Hebrew word */
.inl{direction:ltr; unicode-bidi:isolate; white-space:nowrap; margin-inline:.16em}
.lt{direction:ltr; unicode-bidi:isolate; margin-inline:.12em}

/* ===== flow diagram ===== */
.flowwrap{background:var(--code); border:1px solid var(--line); border-radius:10px; padding:1.1rem .9rem; margin:.9rem 0}
.flow{position:relative; padding-right:76px; max-width:520px; margin:0 auto}
.flow .box{background:var(--card); border:2px solid var(--fg); border-radius:6px; text-align:center;
           padding:.45rem .6rem; font-weight:600; font-size:1rem; box-shadow:2px 2px 0 rgba(0,0,0,.14)}
.flow .box.on{background:var(--hl); border-color:var(--hlb)}
.flow .arr{text-align:center; font-size:1.25rem; line-height:1; color:var(--fg); margin:.28rem 0}
.flow .loop{position:absolute; right:16px; top:1.35rem; bottom:1.35rem; width:48px;
            border:4px solid var(--fg); border-left:0; border-radius:0 16px 16px 0}
/* arrowhead at the top-left end of the loop, pointing left, into the first box */
.flow .loop::after{content:""; position:absolute; top:-6px; left:-14px; width:0; height:0;
            border-top:8px solid transparent; border-bottom:8px solid transparent;
            border-right:15px solid var(--fg)}

/* ===== dice diagram ===== */
.dice{background:var(--code); border:1px solid var(--line); border-radius:10px; padding:1rem; margin:.9rem 0}
.dice .band{display:flex; align-items:center; gap:.6rem; justify-content:center; font-weight:700; font-size:.98rem; margin:.35rem 0}
.dice .band .ln{flex:1; height:0; border-top:3px solid var(--fg); max-width:150px}
.dice .band.inf{color:var(--accent2)} .dice .band.inf .ln{border-color:var(--accent2)}
.dice .row{display:grid; grid-template-columns:minmax(150px,220px) minmax(0,1fr); gap:1rem; align-items:center; margin:.5rem 0}
.dice .side{text-align:center}
.dice .side img{width:92px; display:block; margin:.15rem auto}
.dice .side .lbl{font-weight:800; font-size:1.05rem}
.dice .side .lbl.fair{color:#1a52c4} .dice .side .lbl.bias{color:#c41a1a}
.dice .side + .side{margin-top:.7rem}
@media(max-width:620px){.dice .row{grid-template-columns:1fr}}

/* ===== figures ===== */
figure{margin:1rem 0; background:var(--code); border:1px solid var(--line); border-radius:10px; padding:.8rem}
figure img{max-width:100%; display:block; margin:0 auto; border-radius:6px}
figcaption{font-size:.88rem; color:var(--muted); margin-top:.6rem; text-align:center}
figcaption .srcline{display:block; direction:ltr; font-size:.72rem; margin-top:.25rem; word-break:break-all}

/* ===== misc ===== */
table.map{width:100%; border-collapse:collapse; margin:.8rem 0; font-size:.93rem}
table.map th,table.map td{border:1px solid var(--line); padding:.45rem .6rem; text-align:right; vertical-align:top}
table.map th{background:var(--hl); font-weight:700}
table.map td.c{text-align:center; white-space:nowrap}
/* the index's topic map: five columns of link lists, which is more than fits
   an A4 print column. The link cells must be allowed to wrap (td.c forbids it
   for the short numeric cells it was written for), the topic column gets a
   fixed share so it stops breaking one word per line, and the whole thing may
   scroll sideways on a narrow screen rather than push the page out. */
table.topics{font-size:.85rem; table-layout:fixed}
table.topics td{white-space:normal; text-align:right}
table.topics col.topic{width:24%}
table.topics col.lec{width:10%}
/* each link is one label; isolating it keeps the RTL separators between the
   links from reordering a label that opens in Latin ("HW5") */
table.topics td.lnk a{unicode-bidi:isolate}
table.topics td.lnk{overflow-wrap:anywhere}
table.topics th[colspan]{background:var(--code); text-align:center; letter-spacing:.02em}
.scrollx{overflow-x:auto}

/* ===== shared comments =====
   The button lives in the card's normal flow rather than pinned to a corner:
   the top-left already holds the slide-number badge, and anything absolute
   would collide with a heading or a formula on some card out of 933. It is
   always laid out and only fades in on hover, so revealing it never reflows
   the page. A card that already has comments keeps its badge visible. */
.slide > .crow{display:flex; justify-content:flex-end; margin:.7rem 0 -.15rem;
  opacity:0; transition:opacity .15s ease}
.slide:hover > .crow, .slide > .crow.has, .slide > .crow.open{opacity:1}
.slide > .crow button{font:inherit; font-size:.8rem; cursor:pointer;
  display:inline-flex; align-items:center; gap:.3rem; white-space:nowrap;
  padding:.15rem .6rem; border-radius:999px;
  border:1px solid var(--line); background:var(--bg); color:var(--muted)}
.slide > .crow button:hover{border-color:var(--accent2); color:var(--accent2)}
.slide > .crow button .n{font-weight:700; color:var(--accent2)}
.slide > .crow.has button{border-color:var(--hlb); background:var(--hl)}

/* the form drops in under the card it belongs to */
.cform{margin:.6rem 0 0; padding:.7rem .8rem; border-radius:10px;
  background:var(--code); border:1px solid var(--line)}
.cform input,.cform textarea{font:inherit; width:100%; margin:.2rem 0 .45rem;
  padding:.35rem .55rem; border-radius:7px; border:1px solid var(--line);
  background:var(--card); color:var(--fg)}
.cform textarea{min-height:4.5rem; resize:vertical}
.cform label{font-size:.8rem; color:var(--muted)}
.cform .row{display:flex; gap:.5rem; align-items:center}
.cform .row button{font:inherit; font-size:.85rem; cursor:pointer;
  padding:.3rem .9rem; border-radius:999px; border:1px solid var(--line);
  background:var(--bg); color:var(--fg)}
.cform .row button.go{background:var(--accent2); border-color:var(--accent2); color:#fff}
.cform .msg{font-size:.82rem; color:var(--alertfg)}

/* one comment, in the card and in the list at the foot of the page */
.cmt{border-top:1px solid var(--line); padding:.55rem 0}
.cmt:first-child{border-top:0}
.cmt .who{font-weight:700; font-size:.9rem}
.cmt .when{font-size:.78rem; color:var(--muted); margin-inline-start:.4rem}
.cmt .txt{white-space:pre-wrap; margin:.2rem 0 0; font-size:.95rem}
.cmt .del{font:inherit; font-size:.75rem; cursor:pointer; color:var(--muted);
  background:none; border:0; padding:0 .3rem; text-decoration:underline}
.cmt .del:hover{color:var(--accent)}
.cgroup{margin:.9rem 0}
.cgroup > .h{font-weight:700; font-size:.92rem; margin-bottom:.1rem}
.cgroup > .h a{text-decoration:none}
.cempty{color:var(--muted); font-size:.92rem}
@media print{.slide > .crow, .cform, #comments{display:none}}

/* the same action, parked under the contents where it is reachable from
   anywhere on the page. The contents panel scrolls on its own once a part has
   twenty-odd sub-lectures, so the button sticks to its bottom edge rather than
   sitting after the last entry where it would need scrolling to reach. */
nav.toc .cnavadd{position:sticky; bottom:-.9rem; z-index:1;
  display:block; width:100%; margin:.55rem 0 0; padding:.4rem .5rem 0;
  font:inherit; font-size:.78rem; cursor:pointer; text-align:start;
  border:0; border-top:1px solid var(--line); border-radius:0;
  background:var(--sidebar); color:var(--muted)}
nav.toc .cnavadd:hover{color:var(--accent2)}
nav.toc .cnavadd .n{font-weight:700; color:var(--accent2)}
@media print{nav.toc .cnavadd{display:none}}

/* ===== the comments band =====
   Outside .wrap, so it runs the full width under both columns instead of
   sitting in the content track. The inner box repeats the grid's own maximum
   width and padding, so the band's text lines up with the page above it. */
#comments{border-top:1px solid var(--line); background:var(--card);
  padding:1.6rem 0 2rem; margin-top:1.5rem}
#comments .cinner{max-width:1360px; margin:0 auto; padding:0 1rem}
#comments h2{margin:0 0 .3rem; font-size:1.3rem; color:var(--fg);
  border-bottom:0; padding:0}
#comments > .cinner > .sub{margin:0 0 1.1rem; max-width:62ch}
#comments h3{margin:0 0 .5rem; font-size:.82rem; letter-spacing:.04em;
  text-transform:uppercase; color:var(--muted)}
.ccols{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:1.6rem}
.ccol{min-width:0}
@media (max-width:860px){.ccols{grid-template-columns:1fr}}
/* the permutation table of Part 4 is long and narrow: tighten it, and keep the
   two rows the slide colours (observed / example split) marked */
table.perm{font-size:.88rem; max-width:34rem}
/* every cell is a bare number: force LTR so a leading minus stays in front */
table.perm td{padding:.2rem .5rem; direction:ltr; unicode-bidi:isolate}
table.perm tr.red td{color:#c0392b; font-weight:700}
table.perm tr.blue td{color:#3b45b0; font-weight:700}
@media (prefers-color-scheme:dark){
  table.perm tr.red td{color:#ff7b6b} table.perm tr.blue td{color:#8f9bff}}
:root[data-theme="dark"] table.perm tr.red td{color:#ff7b6b}
:root[data-theme="dark"] table.perm tr.blue td{color:#8f9bff}
:root[data-theme="light"] table.perm tr.red td{color:#c0392b}
:root[data-theme="light"] table.perm tr.blue td{color:#3b45b0}
mark.hit{background:#ffe066; color:#111; border-radius:3px}
mark.hit.cur{background:#ff9f1a}
.footer{max-width:var(--maxw); margin:2rem auto 0; padding:1rem; color:var(--muted); font-size:.85rem; border-top:1px solid var(--line)}
kbd{background:var(--code); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 .35em; font-size:.85em}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.toc{position:static; max-height:none}
  body.tocoff .wrap{grid-template-columns:1fr}
  body.tocoff nav.toc{display:none}
  body.tocoff main{max-width:100%}
}
@media print{
  .topbar,nav.toc{display:none}
  .wrap{display:block; padding:0}
  /* the printed page must not depend on whether the contents panel happened
     to be folded when the reader hit print */
  body.tocoff main{max-width:var(--maxw)}
  body{background:#fff; font-size:12pt}
  .slide,.quotecard,.pagehead{break-inside:avoid; box-shadow:none}
  section.lec>h2{break-after:avoid}
}

/* ---- topic intro panel, figures, chips, topic grid, prev/next (added) ---- */
.intro-hero{background:linear-gradient(135deg,var(--hl),var(--card) 70%); border:1px solid var(--hlb);
  border-radius:14px; padding:1.2rem 1.35rem; margin:0 0 1.2rem}
.intro-hero h3{margin:.1rem 0 .55rem; font-size:1.2rem}
.intro-hero .oneliner{font-size:1.08rem; line-height:1.6; margin:.2rem 0 .9rem; padding:.6rem .85rem;
  background:var(--card); border-radius:10px; border-right:4px solid var(--accent)}
.intro-hero .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:.9rem}
.intro-hero .cols > div{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.7rem .9rem}
.intro-hero .cols h4{margin:0 0 .35rem; font-size:.95rem; color:var(--accent2)}
.intro-hero ul{margin:.2rem 0; padding-inline-start:1.1rem}
.chips{display:flex; flex-wrap:wrap; gap:.35rem; margin:.3rem 0}
.chips span{font-size:.82rem; padding:.18rem .6rem; border-radius:999px; background:var(--hl);
  border:1px solid var(--hlb); white-space:nowrap}
figure.sfig{margin:1rem auto; max-width:min(100%, 640px); text-align:center}
figure.sfig img{width:100%; height:auto; border-radius:10px; border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.12); cursor:zoom-in}
figure.sfig.small{max-width:min(100%, 440px)}
figure.sfig figcaption{font-size:.86rem; color:var(--muted); margin-top:.4rem; line-height:1.5}
figure.sfig.zoom{position:fixed; inset:0; z-index:200; max-width:none; margin:0; background:rgba(0,0,0,.85);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2vh 2vw}
figure.sfig.zoom img{max-height:88vh; width:auto; max-width:96vw; cursor:zoom-out}
figure.sfig.zoom figcaption{color:#ddd}
.topicgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:.9rem}
.topicgrid .slide{margin:0; display:flex; flex-direction:column}
.topicgrid .slide h3{margin-top:.1rem}
.topicgrid .slide .tnum{font-size:.78rem; color:#fff; background:var(--accent); border-radius:999px;
  padding:.1rem .55rem; align-self:flex-start; margin-bottom:.35rem}
.topicgrid .slide.star{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}
.topicnav{display:flex; justify-content:space-between; gap:.8rem; margin:1.6rem 0 .5rem; flex-wrap:wrap}
.topicnav a{flex:1 1 220px; padding:.75rem 1rem; border:1px solid var(--line); border-radius:10px;
  background:var(--card); text-decoration:none; color:var(--fg)}
.topicnav a:hover{border-color:var(--accent2)}
.topicnav a small{display:block; color:var(--muted); font-size:.8rem}
.topicnav a.next{text-align:left}
@media print{figure.sfig img{box-shadow:none} .topicnav{display:none}}

/* ---- interactive quiz (mock2) ---- */
.scorebar{position:sticky; top:58px; z-index:40; background:var(--card); border:1px solid var(--hlb);
  border-radius:10px; padding:.55rem .9rem; margin:0 0 1rem; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.scorebar b{color:var(--accent2); font-size:1.1rem}
.scorebar .solbtn{margin-inline-start:auto}
.quiz ol.opts{margin:.6rem 0 0; padding-inline-start:1.6rem}
.quiz ol.opts li{margin:.35rem 0}
.quiz button.opt{width:100%; text-align:right; font:inherit; color:var(--fg); background:var(--card);
  border:1px solid var(--line); border-radius:8px; padding:.5rem .75rem; cursor:pointer; line-height:1.5}
.quiz button.opt:hover{border-color:var(--accent2); background:var(--hl)}
.quiz.done button.opt{cursor:default}
.quiz.done button.opt:hover{background:var(--card); border-color:var(--line)}
.quiz button.opt.is-right,.quiz.done button.opt.is-right:hover{background:var(--exbg); border-color:var(--exbd); color:var(--exfg); font-weight:700}
.quiz button.opt.is-wrong,.quiz.done button.opt.is-wrong:hover{background:var(--alertbg); border-color:var(--alertbd); color:var(--alertfg)}
.quiz .qexp{background:var(--hl); border:1px solid var(--hlb); border-radius:9px; padding:.6rem .9rem; margin-top:.7rem}
.quiz .qexp p{margin:.25rem 0}
.quiz .verdict{font-weight:800}
.quiz.done.right{border-color:var(--exbd)}
.quiz.done.wrong{border-color:var(--alertbd)}
@media print{.scorebar{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html" title="חזרה לעמוד הראשי">{{COURSE}} · <span>{{BRAND}}</span></a>
  {{HOME}}
  <button id="toctoggle" class="tocbtn" dir="ltr" aria-expanded="true" aria-controls="pagetoc" title="הסתר את תוכן העניינים">❯</button>
  <div class="spacer"></div>
  <input type="search" id="q" placeholder="חיפוש בעמוד…" aria-label="חיפוש" title="Enter — ההתאמה הבאה, Shift+Enter — הקודמת, Esc — ניקוי">
  <span id="hitinfo"></span>
  <button id="fold" title="כווץ / פתח את כל תיבות ההסבר">💡</button>
  <button id="theme" title="מצב כהה/בהיר">🌓</button>
  <button onclick="window.print()" title="הדפסה / PDF">🖨️</button>
</div>
